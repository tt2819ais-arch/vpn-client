name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (xcodebuild)
    runs-on: macos-14
    timeout-minutes: 25

    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List Xcode SDKs and schemes
        run: |
          xcodebuild -list -project VPNClient.xcodeproj
          xcodebuild -showsdks | head -40

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VPNClient.xcodeproj \
            -scheme VPNClient

      - name: Build app target (no codesign)
        run: |
          set -o pipefail
          xcodebuild \
            -project VPNClient.xcodeproj \
            -scheme VPNClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || (echo "Build failed"; exit 1)

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project VPNClient.xcodeproj \
            -scheme VPNClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -only-testing:VPNClientTests | xcpretty
