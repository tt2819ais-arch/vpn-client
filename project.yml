# Generated by XcodeGen — `xcodegen generate` to (re)create VPNClient.xcodeproj
# Repo: tt2819ais-arch/vpn-client

name: VPNClient
options:
  bundleIdPrefix: com.tt2819ais.vpnclient
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: "-ObjC -lresolv"

# LibXray is vendored as a binary xcframework at Vendor/LibXray.xcframework.
# CI downloads it from the public wanliyunyan/LibXray release; locally, drop
# the same xcframework into Vendor/. The framework is embedded into both the
# main app and the PacketTunnel extension. The extension is the actual user
# of LibXray (it boots an in-process Xray instance to terminate VLESS+Reality
# tunnels); the main app embeds it for symbol lookup convenience and also
# because iOS requires extension-embedded frameworks to be present in the host.

targets:
  VPNClient:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    resources:
      - App/Assets.xcassets
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VPN v2 BLACK
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Используется для измерения пинга до VPN серверов"
        NSUserActivityTypes:
          - ToggleVPNIntent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tt2819ais.vpnclient
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: App/VPNClient.entitlements
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: App/VPNClient.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.tt2819ais.vpnclient
        com.apple.developer.usernotifications.communication: false
    dependencies:
      - target: PacketTunnel
        embed: true
        codeSign: true
      - target: VPNClientWidget
        embed: true
        codeSign: true
      - framework: Vendor/LibXray.xcframework
        embed: true
        codeSign: true
      - sdk: NetworkExtension.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: VPN Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tt2819ais.vpnclient.tunnel
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.tt2819ais.vpnclient
    dependencies:
      - sdk: NetworkExtension.framework
      - framework: Vendor/LibXray.xcframework
        embed: false   # main app embeds; extension just links

  VPNClientWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    resources:
      - Widget/Resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: VPN Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tt2819ais.vpnclient.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tt2819ais.vpnclient
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  VPNClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tt2819ais.vpnclient.tests
    dependencies:
      - target: VPNClient

schemes:
  VPNClient:
    build:
      targets:
        VPNClient: all
        PacketTunnel: all
        VPNClientWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VPNClientTests
    archive:
      config: Release
